<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - SmartBuilding Team 01</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #E2E8F0, #F8FAFC);
      padding: 24px;
    }
    .login-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 440px;
      border-radius: var(--border-radius-lg);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border-color);
      padding: 36px;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-icon {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
    .demo-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--border-color);
    }
    .demo-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      text-align: center;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">🏢</div>
        <h2 style="font-size: 1.5rem; font-weight: 700;">SmartBuilding</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Hệ thống Quản lý Vận hành & Năng lượng (Team 01)</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="emailInput">Địa chỉ Email</label>
          <input type="email" id="emailInput" class="form-control" placeholder="name@smartbuilding.io" required value="manager@smartbuilding.io">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
            <label class="form-label" for="passwordInput" style="margin-bottom: 0;">Mật khẩu</label>
            <a href="#" style="font-size: 0.78rem; color: var(--secondary-blue);">Quên mật khẩu?</a>
          </div>
          <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required value="password123">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">Đăng Nhập Ngay</button>
      </form>

      <!-- Fast Demo Role Login -->
      <div class="demo-box">
        <div class="demo-title">⚡ Đăng nhập nhanh kiểm thử (Demo Fast-Login)</div>
        <div class="demo-grid">
          <button type="button" class="btn btn-outline btn-sm" onclick="demoFastLogin('manager')">
            🎯 Manager (SV3)
          </button>
          <button type="button" class="btn btn-outline btn-sm" onclick="demoFastLogin('admin')">
            ⚙️ Admin (SV3)
          </button>
          <button type="button" class="btn btn-outline btn-sm" onclick="demoFastLogin('engineer')">
            🔧 Engineer (SV1)
          </button>
          <button type="button" class="btn btn-outline btn-sm" onclick="demoFastLogin('occupant')">
            🌱 Occupant (SV2)
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 24px;">
        <a href="../index.html" style="font-size: 0.85rem; color: var(--text-muted);">&larr; Quay lại Trang chủ</a>
      </div>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
